function Hero3D(){
var ref=useRef(null);
useEffect(function(){
var el=ref.current,w=el.clientWidth,hh=el.clientHeight;
var css=getComputedStyle(document.documentElement);
var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,w/hh,.1,100);cam.position.z=7;
var r=new THREE.WebGLRenderer({antialias:true,alpha:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(w,hh);el.appendChild(r.domElement);
var g=new THREE.Group();scene.add(g);
var c1=new THREE.Color(css.getPropertyValue('--a1').trim()||'#8f7bff'),c2=new THREE.Color(css.getPropertyValue('--a2').trim()||'#2de2c0');
var knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.7,.45,160,24),new THREE.MeshBasicMaterial({color:c1,wireframe:true,transparent:true,opacity:.75}));
var core=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,1),new THREE.MeshBasicMaterial({color:c2,wireframe:true}));
g.add(knot,core);
var n=500,pos=new Float32Array(n*3);
for(var i=0;i<n;i++){var rad=4+Math.random()*6,t=Math.random()*6.28,p=Math.acos(2*Math.random()-1);
pos[i*3]=rad*Math.sin(p)*Math.cos(t);pos[i*3+1]=rad*Math.sin(p)*Math.sin(t);pos[i*3+2]=rad*Math.cos(p)-3}
var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:c2,size:.04}));scene.add(pts);
var vx=reduce?0:.004,vy=reduce?0:.006,drag=false,lx=0,ly=0,mx=0,my=0;
var d=r.domElement;
d.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;d.setPointerCapture(e.pointerId)});
d.addEventListener('pointerup',function(){drag=false});
d.addEventListener('pointermove',function(e){
mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5);
if(drag){vy=(e.clientX-lx)*.01;vx=(e.clientY-ly)*.01;lx=e.clientX;ly=e.clientY}});
var raf,run=true;
function loop(){raf=requestAnimationFrame(loop);
g.rotation.y+=vy;g.rotation.x+=vx;
if(!drag){vy+=(.006-vy)*.02;vx+=(.002-vx)*.02;if(reduce){vy=0;vx=0}}
core.rotation.y-=.01;pts.rotation.y+=.0006;
cam.position.x+=(mx*1.2-cam.position.x)*.05;cam.position.y+=(-my*1.2-cam.position.y)*.05;cam.lookAt(0,0,0);
r.render(scene,cam)}
loop();
var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){if(!run){run=true;loop()}}else{run=false;cancelAnimationFrame(raf)}});io.observe(el);
var st=gsap.to(g.scale,{x:.5,y:.5,z:.5,scrollTrigger:{trigger:el,start:'top top',end:'bottom top',scrub:true}});
function rs(){var W=el.clientWidth,H=el.clientHeight;r.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()}
addEventListener('resize',rs);
return function(){cancelAnimationFrame(raf);io.disconnect();removeEventListener('resize',rs);st.kill();r.dispose();if(d.parentNode)d.parentNode.removeChild(d)}
},[]);
return h('div',{ref:ref,className:'absolute inset-0','aria-label':'Interactive 3D shape. Drag to rotate 360 degrees.',role:'img'});
}
